name: Deploy to Firebase Hosting (manual)

# Deployment is manual only. There is no deploy on push and no PR preview.
# The CIN agents normally deploy from their own machine with the Firebase CLI
# (CIN loop/DEPLOY.md: checks, preview channel, smoke check, live, rollback).
# This workflow is a manual alternative. Pushing to main does NOT deploy.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to publish to the live site'
        required: true
        type: string

jobs:
  deploy:
    if: github.event.inputs.confirm == 'DEPLOY' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build --if-present

      - name: Deploy to Firebase Hosting (live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIN_FOUNDATION }}'
          channelId: live
          projectId: cin-foundation
